name: pr-build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check (astro check)
        run: pnpm astro check
      - name: Build
        run: pnpm build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --build-arg SITE_URL=https://example.com -t arsenal:pr .
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name arsenal -p 8080:80 arsenal:pr
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<link rel="canonical" href="https://example.com/"'
          curl -fsS -o /dev/null http://127.0.0.1:8080/about/
          curl -fsS -o /dev/null http://127.0.0.1:8080/en/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-such-page)" = 404
          echo "image OK"
      - name: Container logs
        if: always()
        run: docker logs arsenal || true
